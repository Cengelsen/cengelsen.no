<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30">
  <defs>
    <clipPath id="ul"><polygon points="0,0 30,0 0,15"/></clipPath>
    <clipPath id="lr"><polygon points="60,30 30,30 60,15"/></clipPath>
    <clipPath id="ur"><polygon points="60,0 30,0 60,15"/></clipPath>
    <clipPath id="ll"><polygon points="0,30 30,30 0,15"/></clipPath>
  </defs>

  <!-- Blue field -->
  <rect width="60" height="30" fill="#012169"/>

  <!-- St Andrew's Cross (white diagonals) -->
  <path fill="none" stroke="#FFFFFF" stroke-width="10" d="M0,0L60,30M60,0L0,30"/>

  <!-- St Patrick's Cross countercharged red diagonals -->
  <path fill="none" stroke="#C8102E" stroke-width="6" d="M1.34,-2.68L61.34,27.32" clip-path="url(#ul)"/>
  <path fill="none" stroke="#C8102E" stroke-width="6" d="M-1.34,2.68L58.66,32.68" clip-path="url(#lr)"/>
  <path fill="none" stroke="#C8102E" stroke-width="6" d="M58.66,-2.68L-1.34,27.32" clip-path="url(#ur)"/>
  <path fill="none" stroke="#C8102E" stroke-width="6" d="M61.34,2.68L1.34,32.68"   clip-path="url(#ll)"/>

  <!-- St George's Cross (white fimbriation, then red) -->
  <rect x="24" y="0"  width="12" height="30" fill="#FFFFFF"/>
  <rect x="0"  y="9"  width="60" height="12" fill="#FFFFFF"/>
  <rect x="26" y="0"  width="8"  height="30" fill="#C8102E"/>
  <rect x="0"  y="11" width="60" height="8"  fill="#C8102E"/>
</svg>
